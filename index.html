  <head>
    <meta charset="UTF-8" />
    <script>
      // Polyfill window.fetch setter to prevent errors from browser extensions that attempt `window.fetch = ...`
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }

        // Suppress unhandled runtime exceptions from third-party browser extensions
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
